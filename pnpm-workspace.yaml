packages:
  - '.'

minimumReleaseAgeExclude:
  - '@nerima-games/mc-audio@0.2.7 || 0.2.8 || 0.4.0'
  - '@nerima-games/mc-noise@0.3.0 || 0.3.1'
  - '@nerima-games/mc-physics@0.2.1 || 0.2.2'
  - '@nerima-games/mc-save@0.3.0 || 0.4.1'
  - '@nerima-games/mc-sim@0.2.1 || 0.4.1 || 0.4.2 || 0.6.0 || 0.7.0'
  - '@nerima-games/mc-worldgen@0.2.0 || 0.3.0 || 0.3.1 || 0.3.2 || 0.7.0'
  - '@nerima-games/mc-kernel@0.5.1 || 0.6.0 || 0.6.1 || 0.7.0 || 0.11.0 || 0.12.0'

allowBuilds:
  esbuild: true

# GHSA-2v37-7h3g-55p8: nanoid <3.3.18 loops indefinitely for a zero-size custom
# generator. Transitive only (vitest > vite > postcss > nanoid); pinned here
# rather than waiting on the toolchain to bump it upstream.
# pnpm audit found vulnerable transitive packages in Vitest 4's dependency
# tree. Vitest 5 uses @vitest/mocker 5.0.5, so the old mocker override is no
# longer needed. Keep the remaining overrides until patched versions reach the
# dependency tree.
# pnpm audit also found vulnerable transitive launch-editor and shell-quote
# packages in Changesets' dependency tree. Keep the launch-editor and
# shell-quote overrides until Changesets depends on patched versions of both.
overrides:
  nanoid: '>=3.3.18'
  source-map-js: '1.2.2'
  vite: '7.3.7'
  launch-editor: '2.14.2'
  shell-quote: '1.11.0'
