name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # Pinned to a commit, not the mutable v6 tag: a tag can be repointed at
        # new code without any change here (SUPPLY_CHAIN.md「アクションの固定」).
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Fork PR jobs need no push access, so nothing here should keep
          # GITHUB_TOKEN readable by later steps (SUPPLY_CHAIN.md).
          persist-credentials: false

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        # Pinned to a commit, not the mutable v6 tag (SUPPLY_CHAIN.md).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts: pnpm 9 runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The 99% gate (docs/testing.md §6), and it is this step that enforces it.
      # No extra flag is needed and none should be added: the thresholds live in
      # vitest.config.ts, and `vitest run --coverage` exits non-zero by itself
      # when any of the four falls below. Keeping the numbers in the config
      # rather than here means `pnpm test:coverage` gates identically on a laptop
      # and in CI, so the gate cannot be one that only ever fires after a push.
      #
      # NOTE: `pnpm verify` deliberately does NOT include this step — it runs
      # `pnpm test` without coverage. Run `pnpm test:coverage` before pushing if
      # you have touched a branch in domain/ or stages/.
      - name: Coverage (99% gate)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        # Pinned to a commit, not the mutable v6 tag (SUPPLY_CHAIN.md).
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
