name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Configure GitHub Packages authentication
        run: pnpm config set --location=global //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Typecheck
        run: nix develop --command pnpm typecheck

      - name: Lint
        run: nix develop --command pnpm lint

      - name: Checkout shared conformance rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nerima-games/.github
          ref: 26e3dde3909583648694adfc1579299445aced7d
          path: .github/shared-conformance
          persist-credentials: false
          fetch-depth: 1

      - name: Shared conformance
        env:
          CONFORMANCE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          nix develop --command node scripts/verify-shared-conformance.mjs \
            .github/shared-conformance/conformance/ast-grep \
            "$CONFORMANCE_BASE_SHA"

      - name: Changeset status
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qvE '^(docs/|\.github/)'; then
            nix develop --command pnpm exec changeset status --since="origin/${{ github.base_ref }}"
          else
            echo "Only docs/ or .github/ changed; skipping changeset check."
          fi

      - name: Audit dependencies
        run: nix develop --command pnpm audit

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Configure GitHub Packages authentication
        run: pnpm config set --location=global //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Chromium for browser-backed scenarios
        run: nix develop --command pnpm exec playwright install --with-deps chromium

      - name: Tests
        run: nix develop --command pnpm test --reporter=dot

      - name: Coverage
        run: nix develop --command pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  package-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Configure GitHub Packages authentication
        run: pnpm config set --location=global //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Verify package boundary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop --command pnpm package:verify

  genperf-profile:
    if: github.event_name == 'pull_request' && github.head_ref == 'takeokunn-genperf-1-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Record initial runner load
        run: |
          { date -u; nproc; uptime; } | tee "$RUNNER_TEMP/genperf-runner-start.txt"

      - name: Checkout measurement head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Preserve initial runner load
        run: |
          mkdir -p prof
          cp "$RUNNER_TEMP/genperf-runner-start.txt" prof/runner-start.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Configure GitHub Packages authentication
        run: pnpm config set --location=global //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install measurement head dependencies
        id: head-install
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Record measurement revisions and runtime
        run: |
          git rev-parse HEAD | tee prof/head-sha.txt
          nix develop --command node --version | tee prof/node-version.txt
          nix develop --command pnpm exec vitest --version | tee prof/vitest-version.txt
          cat package.json > prof/head-package.json

      - name: Measure head without and with coverage and CPU profiling
        if: always() && steps.head-install.outcome == 'success'
        run: nix develop --command node scripts/genperf-ci.mjs measure head . prof

      - name: Checkout old-dependency main control
        if: always()
        id: main-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 995899393c346f67c03c1888ea9bd251c8df11b0
          path: control-main
          persist-credentials: false

      - name: Install main control dependencies
        if: always() && steps.main-checkout.outcome == 'success'
        id: main-install
        working-directory: control-main
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Record main control revision
        if: always() && steps.main-checkout.outcome == 'success'
        run: |
          git -C control-main rev-parse HEAD | tee prof/main-sha.txt
          cat control-main/package.json > prof/main-package.json

      - name: Measure main without and with coverage
        if: always() && steps.main-install.outcome == 'success'
        run: nix develop --command node scripts/genperf-ci.mjs measure main control-main prof

      - name: Summarize all test times and CPU profiles
        if: always()
        run: |
          set -o pipefail
          nix develop --command node scripts/genperf-ci.mjs summarize prof 2>&1 | tee prof/summary.log

      - name: Record final runner load
        if: always()
        run: |
          { date -u; nproc; uptime; } | tee prof/runner-end.txt

      - name: Upload GENPERF measurement data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: genperf-1-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: prof/
          if-no-files-found: error
          retention-days: 7
